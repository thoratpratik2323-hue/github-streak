name: Daily GitHub Streak

on:
  schedule:
    - cron: '15 4 * * *'    # 04:15 UTC (09:45 AM IST)
    - cron: '15 16 * * *'   # 16:15 UTC (09:45 PM IST)
  workflow_dispatch:        # Manual trigger button in GitHub Actions tab

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Update Activity Record
        run: |
          CURRENT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "Active streak tick: ${CURRENT_DATE}" >> activity.log

      - name: Commit and Push
        run: |
          git config user.name "Pratik Thorat"
          git config user.email "thoratpratik2323@gmail.com"
          git add activity.log
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(streak): daily update [$(date +'%Y-%m-%d')]" && git push origin main)
